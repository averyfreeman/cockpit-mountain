<!-- The Browse dialog behind every path field in hangar.
     One dialog for repository folders, backup sources, exclude files, restore
     targets and rescue-image output, so a path is chosen the same way everywhere.
     Logic lives in js/core/fspicker.js and js/features/fspicker-ui.js. -->
<!-- No x-init="init()" here: Alpine 3 calls init() by itself when the x-data
     object defines one, so writing it out ran init TWICE — two listeners for
     every event, and a dialog that received its own open event twice. The
     second delivery resolved the caller's promise with null, so pressing Save
     on a job closed the dialog and wrote nothing, in silence. -->
<div class="modal fade" id="hangar-fspicker" tabindex="-1"
     aria-labelledby="hangar-fspicker-title" aria-hidden="true"
     x-data="hangarFsPicker()"
     @hidden.bs.modal="if (open) cancel()">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="hangar-fspicker-title" x-text="title"></h5>
                <button type="button" class="btn-close" aria-label="Close"
                        @click="cancel()"></button>
            </div>

            <div class="modal-body">
                <p class="small text-secondary" x-text="prompt"></p>

                <!-- Breadcrumb: a click jumps straight back rather than pressing Up
                     five times. -->
                <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            @click="up()" :disabled="busy || cwd === '/'"
                            aria-label="Go to the parent folder">Up</button>
                    <nav aria-label="Current path" class="flex-grow-1">
                        <ol class="breadcrumb mb-0 small">
                            <template x-for="c in crumbs()" :key="c.path">
                                <li class="breadcrumb-item">
                                    <button type="button" class="btn btn-link btn-sm p-0 align-baseline"
                                            @click="go(c.path)" x-text="c.label"></button>
                                </li>
                            </template>
                        </ol>
                    </nav>
                    <div class="form-check form-switch small mb-0">
                        <input class="form-check-input" type="checkbox" role="switch"
                               id="hangar-fspicker-hidden"
                               :checked="showHidden" @change="toggleHidden()">
                        <label class="form-check-label" for="hangar-fspicker-hidden">Hidden</label>
                    </div>
                </div>

                <!-- An unreadable folder is reported in place; the browser stays
                     where it was rather than bouncing back to '/'. -->
                <div x-show="error">
                    <div class="alert alert-warning py-2 px-3 small" role="alert" x-text="error"></div>
                </div>

                <div class="hangar-tree" style="height: 20rem; overflow: auto;">
                    <div x-show="busy" class="p-3 small text-secondary" role="status" aria-live="polite">
                        Reading…
                    </div>

                    <div x-show="!busy && !entries.length" class="hangar-empty py-4">
                        This folder is empty.
                    </div>

                    <div class="list-group list-group-flush" x-show="!busy && entries.length">
                        <template x-for="e in entries" :key="e.name">
                            <button type="button"
                                    class="list-group-item list-group-item-action d-flex align-items-center gap-2"
                                    :class="isSelected(e) ? 'active' : ''"
                                    @click="activate(e)"
                                    :aria-current="isSelected(e) ? 'true' : null">
                                <span aria-hidden="true" x-text="e.isDir ? '📁' : (e.type === 'l' ? '🔗' : '📄')"></span>
                                <span class="hangar-mono flex-grow-1 text-start" x-text="e.name"></span>
                                <!-- Says why a file is greyed out when a folder was
                                     asked for, rather than just ignoring the click. -->
                                <span class="small text-secondary" x-show="!e.selectable && !e.isDir"
                                      x-text="'not selectable here'"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- New folder. A repository destination usually does not exist yet,
                     and sending the user to a terminal to mkdir it is the detour this
                     dialog exists to remove. -->
                <div class="mt-2">
                    <button type="button" class="btn btn-sm btn-link p-0"
                            x-show="!creating" @click="creating = true">New folder…</button>
                    <div x-show="creating">
                    <div class="d-flex gap-2 align-items-start">
                        <div class="flex-grow-1">
                            <label class="visually-hidden" for="hangar-fspicker-new">New folder name</label>
                            <input id="hangar-fspicker-new" class="form-control form-control-sm"
                                   x-model="newFolder" placeholder="folder name"
                                   spellcheck="false" autocomplete="off"
                                   @keydown.enter.prevent="createFolder()">
                            <template x-for="p in newFolderProblems()" :key="p">
                                <div class="form-text text-warning" x-text="p"></div>
                            </template>
                        </div>
                        <!-- "> 0", not a bare .length: Alpine removes a boolean
                             attribute only for null, undefined or false, and SETS it
                             for anything else — including 0. A valid folder name
                             produced an empty problems array, whose .length is 0, so
                             this button disabled itself permanently the moment the
                             name became valid. -->
                        <button type="button" class="btn btn-sm btn-outline-primary"
                                :disabled="busy || !newFolder || newFolderProblems().length > 0"
                                @click="createFolder()">Create</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                @click="creating = false; newFolder = ''">Cancel</button>
                    </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <!-- What pressing Choose will actually return, shown before it is
                     pressed. In folder mode with nothing selected that is the folder
                     you are standing in, which is not obvious without saying so. -->
                <div class="me-auto small text-secondary text-truncate hangar-mono"
                     style="max-width: 26rem;" x-text="chosen()"></div>
                <button type="button" class="btn btn-secondary" @click="cancel()">Cancel</button>
                <button type="button" class="btn btn-primary"
                        :disabled="!canChoose()" @click="choose()">Choose</button>
            </div>

        </div>
    </div>
</div>
