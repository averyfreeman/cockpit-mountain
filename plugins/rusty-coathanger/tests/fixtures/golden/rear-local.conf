# /etc/rear/local.conf - generated by hangar. Do not edit by hand.
#
# ReaR has no restic workflow. BACKUP=EXTERNAL is documented upstream as a
# last resort with no maintainer support; hangar owns this file so that
# unsupported part is generated, tested and reproducible instead of
# hand-written. Anything added below is lost the next time hangar writes it.

OUTPUT=ISO
OUTPUT_URL='file:///var/lib/rear/output'

USE_SERIAL_CONSOLE=1
KERNEL_CMDLINE='console=tty0 console=ttyS0,115200n8'

BACKUP=EXTERNAL
# BACKUP_URL is unset on purpose: EXTERNAL_BACKUP and EXTERNAL_RESTORE move
# the data themselves, so ReaR has no transport of its own to configure.

# restic reads the live filesystem directly, so ReaR has nothing to mount
# before the backup step runs.
EXTERNAL_SOURCE_MOUNTED=1

# restic exit 3 means the snapshot WAS written and only some files were
# unreadable. Failing the whole rescue build on that would teach the operator
# to ignore genuine errors.
EXTERNAL_IGNORE_ERRORS=1

EXTERNAL_BACKUP=(
    'restic'
    '--repo' '/srv/backups'
    '--password-file' '/etc/hangar/repos/nas-1.key'
    '--cache-dir' '/var/cache/hangar/restic'
    'backup'
    '--tag' 'hangar-dr'
    '--exclude' '/proc'
    '--exclude' '/sys'
    '--exclude' '/dev'
    '--exclude' '/run'
    '--exclude' '/tmp'
    '--exclude' '/var/tmp'
    '--exclude' '/mnt'
    '--exclude' '/media'
    '--exclude' '/lost+found'
    '--exclude' '/var/lib/rear/output'
    '--exclude' '/srv/backups'
    '/'
)

EXTERNAL_RESTORE=(
    'restic'
    '--repo' '/srv/backups'
    '--password-file' '/etc/hangar/repos/nas-1.key'
    '--no-cache' 'restore'
    'latest'
    '--host' 'db01'
    '--path' '/'
    '--target' '/mnt/local'
)

# The rescue system is a fresh initramfs: a binary or file not named here does
# not exist at recovery time, and by then the restore cannot be retried.
REQUIRED_PROGS+=(
    'restic'
)
COPY_AS_IS+=(
    '/etc/hangar/repos/nas-1.key'
)

# Rescue system behaviour.
ISO_DEFAULT='boothd'
GRUB2_DEFAULT_BOOT='chainloader'
GRUB2_TIMEOUT='30'
USER_INPUT_TIMEOUT='30'
# Without DHCP the rescue system has no route to a remote repository, and a
# restore that cannot reach the repository is not a recovery.
USE_DHCLIENT='yes'
KEEP_BUILD_DIR='No'
